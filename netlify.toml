[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Default production backend: Netlify Functions + Netlify Blobs.
# Set STILLMOTION_ADMIN_PASSWORD as a secret for the Functions scope to enable admin.
# Optionally set STILLMOTION_PUBLIC_URL to your canonical frontend URL.
# Legacy PHP hosting remains available with NETLIFY_BACKEND=php and PHP_BACKEND_URL.
